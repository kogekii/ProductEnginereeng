services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?Define APP_URL en el entorno del despliegue}
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL usando postgres como host}
      SESSION_SECRET: ${SESSION_SECRET:?Define un SESSION_SECRET seguro en el VPS}
      DEMO_MODE: "false"
      PORT: "3000"
      UPLOAD_DIR: /app/data/uploads
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RETENTION_DAYS: ${RETENTION_DAYS:-365}
    volumes:
      - app_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Define APP_DOMAIN con el hostname público}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  app_uploads:
  caddy_data:
  caddy_config:
