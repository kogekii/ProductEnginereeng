name: Construir y publicar imagen Docker (PR)

on:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Construir imagen del PR
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código del PR
        uses: actions/checkout@v6

      - name: Configurar emulación ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Definir nombre de imagen
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Iniciar sesión en GHCR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen del PR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          tags: |
            ${{ env.IMAGE }}:pr-${{ github.event.number }}-${{ github.event.pull_request.head.sha }}
            ${{ env.IMAGE }}:latest
