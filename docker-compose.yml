services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Define POSTGRES_USER en .env} -d ${POSTGRES_DB:?Define POSTGRES_DB en .env}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["production"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?Define APP_URL en .env}
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL apuntando a postgres en .env}
      SESSION_SECRET: ${SESSION_SECRET:?Define un SESSION_SECRET seguro en .env}
      DEMO_MODE: "false"
      PORT: "3000"
      UPLOAD_DIR: /app/data/uploads
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RETENTION_DAYS: ${RETENTION_DAYS:-365}
    volumes:
      - app_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    profiles: ["production"]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Define APP_DOMAIN con el hostname público en .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  app_uploads:
  caddy_data:
  caddy_config:
